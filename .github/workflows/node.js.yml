name: Node.js CI

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

permissions:
  contents: read # for checkout

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false # Audit before installing dependencies

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate --prod

      - name: Installing dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify registry signatures for installed packages
        run: pnpm audit signatures

      - name: Linting last commit message
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose

      - name: Linting
        run: pnpm lint

      - name: Type checking
        run: pnpm typecheck

      - name: Spell checking
        run: pnpm spellcheck

      - name: Testing
        run: pnpm coverage

      - name: Building
        run: pnpm build
