name: PR Commit Messages

on:
  pull_request:

env:
  HUSKY: 0

permissions:
  contents: read # for checkout

jobs:
  commit-messages:
    name: Lint commit messages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false # Audit before installing dependencies

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate --prod

      - name: Installing dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify registry signatures for installed packages
        run: pnpm audit signatures

      - name: Linting PR commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
